# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "67a8f61ca9ad53a07e0f732ba385700b"
name = "lingotuner-translate-app"
application_url = "https://lingotuner.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-10"

# =========================
# App lifecycle webhooks
# =========================

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks/app/scopes_update"

# Mandatory compliance webhooks (App Store)
# https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/shop/redact"

# =========================
# ACCESS SCOPES
# =========================

[access_scopes]
scopes = "write_products,read_locales,read_translations,write_translations"

# =========================
# AUTH CALLBACKS
# =========================

[auth]
redirect_urls = [
  "https://lingotuner.vercel.app/auth/callback",
  "https://lingotuner.vercel.app/auth/shopify/callback"
]